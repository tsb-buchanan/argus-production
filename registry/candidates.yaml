resp_curve:
  description: >-
    NUMERICAL VEHICLE, NOT A DESIGN. Ten camber amplitudes spanning the union of the
    cruise candidate's REFLEX range and the low-speed candidates' DROOP range, run to
    build dcl(A/c) and dcd(A/c) as FUNCTIONS. Any spanwise schedule then maps onto the
    curve without new solves. NO WING HAS THIS SHAPE and none should be built from it.
  record: ARG-161
  # ---- THE eta COLUMN IS AN INDEX, NOT A SPAN STATION. ------------------------------
  # morph2d resolves A/c by interpolating on eta, so a response curve has to borrow that
  # axis. eta = k/10 selects the k-th amplitude and MEANS NOTHING SPANWISE. Reading
  # resp_curve eta 0.30 as '30% semi-span' is a frame error; it is amplitude index 3.
  # Interpolating BETWEEN indices is meaningless and the values are deliberately not
  # monotone in index order for the reflex half.
  # ---- WHY THESE TEN AND NOT THE PLAN'S LIST -----------------------------------------
  # Amended from the approved plan (2026-08-12). The plan listed the accidental
  # amplitudes of existing sections; these are chosen so that THREE EXACT ANTISYMMETRIC
  # PAIRS exist, +/-0.005318, +/-0.010633 and +/-0.017733. Thin-aerofoil theory is
  # exactly antisymmetric in A, so a matched pair turns 'is the response linear' from a
  # curve-fit judgement into a DIFFERENCE OF TWO MEASUREMENTS with a known answer of
  # zero. The accidental list could not do that, and it is the same case count.
  camber_schedule:
    status: synthetic_response_curve
    basis: designed amplitude sweep; eta is an INDEX (see comment above)
    record: ARG-161
    antisymmetric_pairs_over_c: [0.005317775998508047, 0.010633467380222406, 0.017732852109618807]
    null_amplitude_over_c: 0.000218   # geometrically baseline to 0.02%c; predicted dcl 0.0029
    A_min_over_c: -0.021173591607709555   # te_b03_c01's delivered max REFLEX
    A_max_over_c: 0.034968   # covers mcv2_eta080, the largest droop ever run here
