  geometry_3d: {file: geometry/derived/wing3d/superseded/baseline_corrected_oml_placed.stl, sha256: 2b65bc9ebb6aa47e614cc686739cdeb62411ae17230a436cc5fb15bd4d0babc0, status: derived_production_NOT_FOR_3D_MESHING, route: "vsp3_to_stl.py --nchord 200 --nspan 240 --blunt-te 0.0063 + apply_placement_transform.py --order xy (IDENTICAL to every other promoted surface)", gates: "all six PASS, te_ref midpoint", te_gap_pct_c: 0.6769, half_model: true, record: D074, amended: "ARG-098 2026-08-03: status was derived_production. It carries the FAN tip cap, a MEASURED defect (valence 398, tip aspect ratio to 35,212, longest edge 76.21 mm). SUPERSEDED AS THE MESHING SURFACE by geometry_3d_laddercap below. RETAINED, and deliberately: it is the bit-for-bit regeneration anchor that scripts/regenerate_oml.py --check reproduces with the default --cap fan, so retiring it would break the gate. USE IT FOR REGENERATION AND CALIBRATION; DO NOT MESH IT."}
