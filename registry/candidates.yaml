  geometry_3d: {file: geometry/derived/wing3d/syn_rectangular_oml.stl, sha256: b43baca0c6c7f9297070d3d853795c034465477660a3d66d6ae5b84605fe7afa, status: derived_production_synthetic, units_output: metres, half_model: true, route: "geometry/scripts/make_synthetic_wing.py --kind rectangular --nchord 200 --nspan 240 (fully analytic)", gates: "13/13 PASS, scripts/check_synthetic_gates.py --kind rectangular", sidecar: geometry/derived/wing3d/syn_rectangular_oml.json, record: GEO-082}

