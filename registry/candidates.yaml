cr2215_n1wt:
  description: NASA CR-2215 Vol II basic airfoil (component N1WT), 9.3% blunt-based supercritical. VALIDATION BENCHMARK ONLY.
  # WHY THIS SECTION. It is the closest published 2D experiment to what ARGUS actually
  # solves: a blunt-based supercritical section (base 0.98%c against our 0.63%c) with
  # measured Cp, wake-rake profile drag, AND measured transition locations, at Mach and
  # Reynolds near Condition CR. The transition data is what makes it usable: our SST runs
  # fully turbulent, so only the TRIPPED condition (A-06) is a like-for-like comparison.
  # NOT our wing section and NOT the TM-89125 methodology airfoil (CR-2215 README: "Do
  # not conflate the three").
  geometry_2d: {file: geometry/derived/benchmarks/cr2215_n1wt.dat,
