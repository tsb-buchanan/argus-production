# =============================================================================
# PHASE 0.5 SYNTHETIC METHOD-VALIDATION WINGS (GEO-082). NOT ARGUS HARDWARE.
# hardware_identity: synthetic, no physical counterpart.
# NO QUANTITY DERIVED FROM THESE EVER ENTERS AN ARGUS COMPARISON, in any form,
# including as a mesh or solver-setting justification quoted against an ARGUS
# result. They exist ONLY to test the 3D RANS route against an answer known
# without measurement.
# Their AREA is 1.114836480 m2, which equals Sref_TP1580 to five figures, and the
# rectangular chord is 0.3048 m = 1 ft EXACTLY, because b/AR = 3.6576/12. That is
# arithmetic, NOT a relationship to the TP-1580 wing, and it is precisely the
# frame-rule collision of the project frame rule, instance 2. Never compare them.
# NO INDUCED-DRAG FIELD (GEO-086): these entries carried CDi_over_CL2 and it
# was REMOVED, not relabelled. No CDi extraction instrument exists in this
# repository yet, so an artifact of ours naming a drag coefficient would
# persuade where an absent one blocks. Recompute 1/(pi AR e) from
# span_efficiency_e if ever needed. dso_strict.CDi on other candidates is
# UNAFFECTED: that is the author's value under the author's namespace.
# =============================================================================
syn_elliptical:
  description: Synthetic elliptical-planform half-wing, NACA 0010, unswept, untwisted
  hardware_identity: "synthetic, no physical counterpart"
  purpose: "KNOWN ANSWER. Lifting-line span efficiency e = 1.000000 EXACTLY for the ideal ellipse, so the RANS induced drag has a reference with NO measurement uncertainty."
  analytic_reference: {span_efficiency_e: 0.999020, e_ideal_untruncated: 1.000000, induced_drag_factor_delta: 0.000981, method: "Prandtl lifting line, scripts/lifting_line.py", scope: "INVISCID, induced drag ONLY; the RANS CD must have its profile part removed before comparison"}
  planform: {type: elliptical_cut_at_eta_0p99, span_full_m: 3.6576, aspect_ratio: 12.0, area_full_m2: 1.114836480, root_chord_m: 0.384664, tip_chord_m: 0.054263, aerofoil: "NACA 0010 analytic, open-TE coefficients, 0.21%c blunt TE", twist_deg: 0.0, dihedral_deg: 0.0, sweep_deg: 0.0}
  # TIP TRUNCATION: a true ellipse has ZERO tip chord and cannot be written as a
  # surface. Cut at eta 0.99 giving a 54.263 mm tip chord. This MOVES THE TARGET
  # from 1.000000 to 0.999020; it does NOT add uncertainty, because the value is
  # exact for the planform actually built. The elliptical-to-rectangular gap of
  # 0.0925 is 94x the truncation penalty, so the directional gate is untouched.
  # PLACEMENT TRANSFORM DELIBERATELY NOT APPLIED: the ARGUS Rx(5.000) @ Ry(1.873)
  # reproduces a parent-Blank transform these wings do not have, and applying it
  # would INVALIDATE THE REFERENCE, which is a planar-wing result (D077).
  geometry_3d: {file: geometry/derived/wing3d/syn_elliptical_oml.stl, sha256: 71eb1e049ba6444554ad8108eac5b159bb4bcdfd351448a2cb42f6603c9324ae, status: derived_production_synthetic, units_output: metres, half_model: true, route: "geometry/scripts/make_synthetic_wing.py --kind elliptical --nchord 200 --nspan 240 (fully analytic, NO external source and so no provenance chain to verify)", gates: "13/13 PASS, scripts/check_synthetic_gates.py --kind elliptical", gates_note: "The ARGUS six-gate suite is NOT applicable and FAILS all six on this correct surface (D077); --demo-argus-suite shows it.", sidecar: geometry/derived/wing3d/syn_elliptical_oml.json, record: GEO-082}

syn_rectangular:
  description: Synthetic rectangular-planform half-wing, NACA 0010, unswept, untwisted
  hardware_identity: "synthetic, no physical counterpart"
  purpose: "DIRECTIONAL GATE. Span efficiency MUST come out BELOW syn_elliptical's. Physics fixes the SIGN, so it is falsifiable without arguing a tolerance (D060)."
